name: Feature request
description: Suggest an idea or an API addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This plugin intentionally keeps a small, focused API surface (see the README). Describing your *use case* helps find the simplest addition that fits.

  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the underlying problem or hardware scenario, not just the API you'd like.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the API to look like? A short code sketch is great.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're currently using, or other approaches you considered.
