name: Tag release

# Whenever pubspec.yaml's `version:` changes on main, this creates the
# matching git tag (vX.Y.Z) and a GitHub Release, then publishes to pub.dev.
#
# The tag + publish steps live in one workflow (instead of the tag push
# triggering a separate publish.yml) because a push made with the default
# GITHUB_TOKEN does NOT trigger other workflow runs — that's a deliberate
# GitHub Actions anti-loop restriction, not a bug. publish.yml is kept
# around separately for the case where a human pushes a vX.Y.Z tag by hand
# (that push uses their own credentials, which does trigger it normally).
#
# Can also be run manually from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.exists == 'false' }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG.md section for this version
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if ($0 ~ "^## \\[?" ver "\\]?([^0-9].*)?$") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for ${{ steps.version.outputs.version }}._" > release_notes.md
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true

  publish:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      id-token: write # required for pub.dev OIDC authentication
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
