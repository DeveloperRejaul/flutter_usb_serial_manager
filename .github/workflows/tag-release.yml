name: Tag release

# Whenever pubspec.yaml's `version:` changes on main, this creates the
# matching git tag (vX.Y.Z) and a GitHub Release. Pushing that tag then
# triggers .github/workflows/publish.yml, which publishes to pub.dev.
#
# The tag push below authenticates with a personal access token
# (secrets.RELEASE_TOKEN), NOT the default GITHUB_TOKEN. This matters for
# two separate reasons:
#   1. A push made with the default GITHUB_TOKEN does not trigger other
#      workflow runs at all (GitHub's anti-loop restriction) — publish.yml
#      would simply never fire.
#   2. Even if it did fire (e.g. by calling the publish workflow directly
#      from a job here), that job would run in the context of this
#      workflow's *branch* push event, not a real tag-ref event. pub.dev's
#      trusted-publisher "tag pattern" check validates the actual ref the
#      triggering run started from, so it rejects anything that isn't a
#      genuine refs/tags/vX.Y.Z-triggered run.
# A PAT-authenticated push produces a real, independent tag-push event
# with the correct ref, satisfying both.
#
# One-time setup: add a fine-grained personal access token scoped to this
# repository only, with "Contents: Read and write" permission, as the
# repository secret RELEASE_TOKEN (Settings -> Secrets and variables ->
# Actions). See README -> Releasing for the full one-time setup checklist.
#
# Can also be run manually from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout persists an auth header for the default
          # GITHUB_TOKEN by default. Left in place, it conflicts with the
          # RELEASE_TOKEN we push with below — the push still succeeds, but
          # GitHub ends up treating it as GITHUB_TOKEN-authenticated and
          # silently never fires publish.yml (confirmed: the v0.0.5 tag
          # push "succeeded" but triggered zero downstream runs). Disabling
          # credential persistence leaves only our explicit RELEASE_TOKEN.
          persist-credentials: false

      - name: Read version from pubspec.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG.md section for this version
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            BEGIN { found = 0 }
            /^## / {
              if (found) exit
              if ($0 ~ "^## \\[?" ver "\\]?([^0-9].*)?$") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for ${{ steps.version.outputs.version }}._" > release_notes.md
          fi

      - name: Create and push tag (using RELEASE_TOKEN so it triggers publish.yml)
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::secrets.RELEASE_TOKEN is not set. Add a fine-grained PAT with 'Contents: Read and write' on this repo as the RELEASE_TOKEN secret (see README -> Releasing), otherwise this tag push will not trigger publish.yml."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: true
