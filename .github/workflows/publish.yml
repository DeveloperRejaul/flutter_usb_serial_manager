name: Publish to pub.dev

# Fires on a real vX.Y.Z tag push — whether pushed by a human, or by
# .github/workflows/tag-release.yml (which authenticates with a personal
# access token specifically so this workflow actually fires; a tag pushed
# with the default GITHUB_TOKEN would not trigger this). Uses pub.dev's
# official OIDC "trusted publishing" reusable workflow, so no long-lived
# pub.dev credentials are stored in this repo.
#
# One-time setup required on pub.dev before this can succeed — see
# https://dart.dev/tools/pub/automated-publishing and the note in
# CONTRIBUTING/README about configuring this repo + workflow as a trusted
# publisher for the flutter_usb_serial_manager package.

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex — a bare
      # `+` outside `+(...)` is a literal character, so `[0-9]+` here would
      # only match tags containing a literal "+" and never actually fire
      # (confirmed by a live test: v0.0.4 didn't trigger this workflow).
      # `v*.*.*` is looser but reliably matches the vX.Y.Z tags
      # tag-release.yml creates.
      - 'v*.*.*'

jobs:
  publish:
    permissions:
      id-token: write # required for pub.dev OIDC authentication
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # with:
    #   working-directory: . # uncomment and set if pubspec.yaml isn't at the repo root
